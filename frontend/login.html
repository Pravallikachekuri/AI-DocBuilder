<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Sign In – AI Document Authoring</title>

    <!-- TEMP: inline styles just to verify the design -->
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            height: 100%;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: radial-gradient(circle at top, #0f172a, #020617);
            color: #e5e7eb;
        }

        .main-centered {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .card {
            background: rgba(15, 23, 42, 0.95);
            border-radius: 18px;
            padding: 28px 32px;
            box-shadow: 0 20px 45px rgba(15, 23, 42, 0.7);
            border: 1px solid rgba(148, 163, 184, 0.2);
            max-width: 420px;
            width: 100%;
            backdrop-filter: blur(16px);
        }

        .card-header {
            margin-bottom: 20px;
        }

        .auth-logo {
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: 0.03em;
            background: linear-gradient(135deg, #22c55e, #38bdf8);
            -webkit-background-clip: text;
            color: transparent;
            margin-bottom: 8px;
        }

        .card-title {
            font-size: 1.5rem;
            font-weight: 600;
            color: #f9fafb;
            margin-bottom: 4px;
        }

        .card-subtitle {
            font-size: 0.9rem;
            color: #9ca3af;
        }

        .form-group {
            margin-top: 16px;
            margin-bottom: 4px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            margin-bottom: 6px;
            color: #e5e7eb;
        }

        input {
            width: 100%;
            padding: 10px 12px;
            border-radius: 10px;
            border: 1px solid rgba(148, 163, 184, 0.6);
            background: rgba(15, 23, 42, 0.8);
            color: #e5e7eb;
            font-size: 0.95rem;
            outline: none;
        }

        input:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 0 1px rgba(56, 189, 248, 0.4);
            background: rgba(15, 23, 42, 0.98);
        }

        button {
            border: none;
            border-radius: 999px;
            padding: 10px 18px;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            width: 100%;
            margin-top: 14px;
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: #ecfdf5;
            box-shadow: 0 12px 30px rgba(22, 163, 74, 0.5);
        }

        button:hover {
            transform: translateY(-1px);
            box-shadow: 0 16px 40px rgba(22, 163, 74, 0.65);
        }

        .message {
            margin-top: 10px;
            padding: 8px 12px;
            border-radius: 10px;
            font-size: 0.85rem;
            display: none;
        }

        .message.success {
            display: block;
            background: rgba(22, 163, 74, 0.1);
            color: #bbf7d0;
            border: 1px solid rgba(22, 163, 74, 0.5);
        }

        .message.error {
            display: block;
            background: rgba(239, 68, 68, 0.1);
            color: #fecaca;
            border: 1px solid rgba(239, 68, 68, 0.5);
        }

        .auth-footer {
            margin-top: 18px;
            text-align: center;
            font-size: 0.85rem;
            color: #9ca3af;
        }

        .auth-footer a {
            color: #38bdf8;
            text-decoration: none;
        }

        .auth-footer a:hover {
            text-decoration: underline;
        }
    </style>

    <!-- Your JS still works the same -->
    <script src="js/api.js" defer></script>
    <script src="js/auth.js" defer></script>
</head>

<body>
    <main class="main-centered">
        <div class="card">
            <div class="card-header">
                <div class="auth-logo">AI Docs Studio</div>
                <div class="card-title">Welcome back</div>
                <div class="card-subtitle">
                    Sign in to continue creating smart documents.
                </div>
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Email address</label>
                    <input id="email" type="email" placeholder="you@example.com" required />
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input id="password" type="password" placeholder="••••••••" required />
                </div>

                <button type="submit">Sign In</button>

                <div id="message" class="message"></div>
            </form>

            <div class="auth-footer">
                New here?
                <a href="index.html">Create an account</a>
            </div>
        </div>
    </main>
</body>

</html>
